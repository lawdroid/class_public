# GD Test: Kohlrausch (Stretched Exponential) Transition
# Tom Martin's conservative parameterization
# κ_c = 1.176 (Scher-Zallen), z_onset = 10^6, z_freeze = 1100, β = 0.5
# Target: H₀ ~ 72-73 km/s/Mpc from sound horizon shift

root = output/gd_test_KR_
write_background = yes
write_thermodynamics = no
output = tCl,pCl,lCl

# Cosmological parameters (Planck 2018 best-fit baseline)
h = 0.6736
T_cmb = 2.7255
omega_b = 0.02237
omega_cdm = 0.1200
N_ur = 2.0328
N_ncdm = 1
m_ncdm = 0.06

# Reionization
reio_parametrization = reio_camb
tau_reio = 0.0544

# Primordial spectrum
P_k_ini type = analytic_Pk
n_s = 0.9649
A_s = 2.1e-9
k_pivot = 0.05

# ==== GLASSY DYNAMICS: Kohlrausch transition ====
gd_kappa_c = 1.176
gd_z_freeze = 1100
gd_z_onset = 1000000
gd_beta = 0.5

# Precision settings
l_max_scalars = 2500
background_verbose = 2
