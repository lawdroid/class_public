# GD Test: Recombination Quench (Tom's Feb 26 directive)
# Steep stretched exponential centered at z ~ 1090, width Dz ~ 100
# kappa = 0.85 for z >> 1140 (pre-recombination, stronger gravity)
# kappa = 1.0  for z << 1040 (post-recombination, standard)
# Phase C: G_eff active in both background AND perturbations

root = output/gd_quench_
write_background = yes
write_thermodynamics = no
output = tCl,pCl,lCl

# Cosmological parameters (Planck 2018 best-fit baseline)
h = 0.6736
T_cmb = 2.7255
omega_b = 0.02237
omega_cdm = 0.1200
N_ur = 2.0328
N_ncdm = 1
m_ncdm = 0.06

# Reionization
reio_parametrization = reio_camb
tau_reio = 0.0544

# Primordial spectrum
P_k_ini type = analytic_Pk
n_s = 0.9649
A_s = 2.1e-9
k_pivot = 0.05

# ==== GLASSY DYNAMICS: Recombination quench ====
# z_onset = 1140 (kappa=0.85 above here)
# z_freeze = 1040 (kappa=1.0 below here)
# Transition width ~ 100 in z, centered at z ~ 1090
gd_kappa_c = 0.85
gd_z_freeze = 1040
gd_z_onset = 1140
gd_beta = 0.5

# Precision settings
l_max_scalars = 2500
background_verbose = 2
