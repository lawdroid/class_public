# GD Test: Sharp Step Function at Recombination
# kappa = 0.85 for z > 1100 (entire pre-recombination era)
# kappa = 1.0  for z < 1100 (post-recombination, standard)
# Tests maximum possible H0 from compliant inclusion model
# NOTE: kappa = 0.85 applies during BBN — this is a diagnostic test only

root = output/gd_step_
write_background = yes
write_thermodynamics = no
output = tCl,pCl,lCl

# Cosmological parameters (Planck 2018 best-fit baseline)
h = 0.6736
T_cmb = 2.7255
omega_b = 0.02237
omega_cdm = 0.1200
N_ur = 2.0328
N_ncdm = 1
m_ncdm = 0.06

# Reionization
reio_parametrization = reio_camb
tau_reio = 0.0544

# Primordial spectrum
P_k_ini type = analytic_Pk
n_s = 0.9649
A_s = 2.1e-9
k_pivot = 0.05

# ==== GLASSY DYNAMICS: Sharp step at recombination ====
# z_onset = 1101, z_freeze = 1100 => step over dz = 1
gd_kappa_c = 0.85
gd_z_freeze = 1100
gd_z_onset = 1101
gd_beta = 0.5

# Precision settings
l_max_scalars = 2500
background_verbose = 2
