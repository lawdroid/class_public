# LCDM Baseline Test Configuration
# Same as gd_test.ini but with gd_kappa_c = 1.0 (no GD modification)

root = output/lcdm_test_
write_background = yes
write_thermodynamics = no
output = tCl,pCl,lCl

# Cosmological parameters (Planck 2018 baseline)
h = 0.6736
T_cmb = 2.7255
omega_b = 0.02237
omega_cdm = 0.1200
N_ur = 2.0328
N_ncdm = 1
m_ncdm = 0.06

# Reionization
reio_parametrization = reio_camb
tau_reio = 0.0544

# Primordial spectrum
P_k_ini type = analytic_Pk
n_s = 0.9649
A_s = 2.1e-9
k_pivot = 0.05

# ==== NO GD MODIFICATION ====
gd_kappa_c = 1.0

# Precision settings
l_max_scalars = 2500
background_verbose = 2
