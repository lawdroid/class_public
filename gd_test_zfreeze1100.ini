# Glassy Dynamics Test - z_freeze at recombination
root = output/gd_zf1100_
write_background = yes
output = tCl,pCl,lCl

# Cosmological parameters (Planck 2018 baseline)
h = 0.6736
T_cmb = 2.7255
omega_b = 0.02237
omega_cdm = 0.1200
N_ur = 2.0328
N_ncdm = 1
m_ncdm = 0.06

# Reionization
reio_parametrization = reio_camb
tau_reio = 0.0544

# Primordial spectrum
P_k_ini type = analytic_Pk
n_s = 0.9649
A_s = 2.1e-9
k_pivot = 0.05

# ==== GD with z_freeze at recombination ====
gd_kappa_c = 1.176
gd_z_freeze = 1100
gd_omega_BD = 50000
gd_phi_c = 0.15

l_max_scalars = 2500
background_verbose = 1
