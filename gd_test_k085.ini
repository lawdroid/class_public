# Glassy Dynamics Test - κ < 1 to INCREASE H₀
#
# Physics: κ = 0.85 at late times
# G_eff = G_N/κ = G_N/0.85 = 1.176 × G_N (stronger gravity)
# H₀_new = H₀_old / sqrt(κ) = 67.36 / sqrt(0.85) ≈ 73.1 km/s/Mpc
#
root = output/gd_k085_
write_background = yes
output = tCl,pCl,lCl

# Cosmological parameters (Planck 2018 baseline)
h = 0.6736
T_cmb = 2.7255
omega_b = 0.02237
omega_cdm = 0.1200
N_ur = 2.0328
N_ncdm = 1
m_ncdm = 0.06

# Reionization
reio_parametrization = reio_camb
tau_reio = 0.0544

# Primordial spectrum
P_k_ini type = analytic_Pk
n_s = 0.9649
A_s = 2.1e-9
k_pivot = 0.05

# ==== CORRECTED GD PARAMETERS ====
# κ = 0.85 gives H₀ increase by factor 1/sqrt(0.85) = 1.084
gd_kappa_c = 0.85
gd_z_freeze = 1100
gd_omega_BD = 50000

# Precision settings
l_max_scalars = 2500
background_verbose = 1
