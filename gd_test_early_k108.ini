# Glassy Dynamics Test - EARLY-TIME κ > 1
#
# Physics: κ = 1.08 at early times (z > z_freeze)
#          κ = 1.0  at late times (z < z_freeze)
#
# G_eff = G_N/κ = G_N/1.08 = 0.926 G_N at early times (weaker gravity)
#
# Mechanism: CMB forms with modified expansion history
#            CMB "sees" universe that would have lower H₀
#            Late-time is standard → local H₀ is true value
#            Tension = CMB underestimates true H₀
#
root = output/gd_early_k108_
write_background = yes
output = tCl,pCl,lCl

# Cosmological parameters (Planck 2018 baseline)
h = 0.6736
T_cmb = 2.7255
omega_b = 0.02237
omega_cdm = 0.1200
N_ur = 2.0328
N_ncdm = 1
m_ncdm = 0.06

# Reionization
reio_parametrization = reio_camb
tau_reio = 0.0544

# Primordial spectrum
P_k_ini type = analytic_Pk
n_s = 0.9649
A_s = 2.1e-9
k_pivot = 0.05

# ==== EARLY-TIME GD PARAMETERS ====
# κ > 1 at early times → weaker gravity → modified CMB
# κ = 1 at late times → standard physics → protected ISW
gd_kappa_c = 1.08
gd_z_freeze = 1100
gd_omega_BD = 50000

# Precision settings
l_max_scalars = 2500
background_verbose = 1
