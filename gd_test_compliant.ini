# GD Test: Compliant Inclusion Model
# Tom Martin's pivot: kappa = 1 - phi = 0.85
# Early universe: kappa = 0.85 (stronger gravity, G_eff = G_N/0.85 = 1.176 G_N)
# Late universe: kappa = 1.0 (standard gravity)
# Transition: stretched exponential from 0.85 -> 1.0 between z_onset and z_freeze

root = output/gd_compliant_
write_background = yes
write_thermodynamics = no
output = tCl,pCl,lCl

# Cosmological parameters (Planck 2018 best-fit baseline)
h = 0.6736
T_cmb = 2.7255
omega_b = 0.02237
omega_cdm = 0.1200
N_ur = 2.0328
N_ncdm = 1
m_ncdm = 0.06

# Reionization
reio_parametrization = reio_camb
tau_reio = 0.0544

# Primordial spectrum
P_k_ini type = analytic_Pk
n_s = 0.9649
A_s = 2.1e-9
k_pivot = 0.05

# ==== GLASSY DYNAMICS: Compliant inclusion model ====
# kappa_c = 0.85 applied at early times (z >= z_onset)
# Standard gravity (kappa = 1.0) at late times (z <= z_freeze)
# NOTE: z_onset = 10^6 means kappa = 0.85 during BBN (z ~ 10^9).
#       This is a known issue; BBN constraints deferred to Phase C.
gd_kappa_c = 0.85
gd_z_freeze = 1100
gd_z_onset = 1000000
gd_beta = 0.5

# Precision settings
l_max_scalars = 2500
background_verbose = 2
